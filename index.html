<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 24px;
    }

    .loader {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .progress {
      width: 220px;
      height: 5px;
      margin: 24px auto 0;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #38bdf8;
      animation: progress 5s linear forwards;
    }

    @keyframes progress {
      to {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="loader"></div>
    <h2>Loading...</h2>
    <p>Please wait, redirecting...</p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script>
    // 修改成你的目的链接
    const destination = "https://1xroll.my/?AgentCode=467383";

    // 等待 5 秒后跳转
    setTimeout(() => {
      window.location.replace(destination);
    }, 5000);
  </script>
</body>
</html>
